# VirtLauncher - File System Redirect Config
# ============================================
# Format:  source_path=destination_path
# - One redirect per line
# - Paths are Win32 absolute paths (drive-letter based)
# - Case-insensitive prefix matching on NT device paths
# - Lines starting with # or ; are comments
# - More specific paths should come BEFORE less specific ones
#
# How it works:
#   When the application reads or writes any path that starts
#   with source_path, the request is silently redirected to
#   destination_path (without the application knowing).
#
# Sections:
#   [redirect]  Maps source paths to virtual destination paths.
#   [exclude]   Paths that are NEVER virtualised. Reads and writes
#               go directly to the real folder, even if a [redirect]
#               rule or --filesystem would otherwise cover them.
#               Exclusions take priority over all redirect rules.
#
# Typical use-case for [exclude]:
#   Virtualise an entire drive (e.g. C:\=D:\Sandbox\) but let the
#   app read system folders (C:\Windows, C:\Program Files\...) from
#   the real file system so it does not need a copy of them in the
#   sandbox. List those folders under [exclude] and they will be
#   passed through untouched.
#
# Matching rules:
#   - Matching is a case-insensitive prefix check on the NT device
#     path (\??\C:\...), with a component-boundary guard so that
#     excluding C:\Win will NOT accidentally match C:\Windows.
#   - Trailing backslashes in paths are ignored (C:\Foo\ == C:\Foo).
#   - Environment variables are NOT expanded.
# ============================================

[redirect]

# Redirect app data folder to a portable location
# C:\Users\YourName\AppData\Local\MyApp=D:\Portable\MyApp\AppData

# Redirect a legacy install folder to a different drive
# C:\Program Files\LegacyApp=E:\Portable\LegacyApp

# Redirect an entire drive into a sandbox folder.
# Combined with [exclude] below, this virtualises C:\ while letting
# system folders through to the real file system.
C:\=D:\MySandbox\



[exclude]
# Paths listed here are NEVER redirected.
# The application reads and writes them on the real file system,
# exactly as if no virtualisation were active.
#
# Rules:
#   - One path per line, Win32 absolute path (no '=' sign)
#   - Both C:\Windows and C:\Windows\ are accepted
#   - Matching uses the same component-boundary guard as [redirect],
#     so C:\Win will NOT match C:\Windows
#   - Exclusions override [redirect] rules and --filesystem

# Let the app use the real Windows installation
C:\Windows

# Let the app use the real system-wide runtime libraries and COM components
C:\Program Files\Common Files
C:\Program Files (x86)\Common Files


